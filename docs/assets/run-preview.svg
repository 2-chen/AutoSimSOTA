<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-labelledby="title desc">
<title id="title">RUN.md：人类可读的研究笔记</title><desc id="desc">报告设计示意，所有指标待评测，没有虚构结果。</desc><rect width="1600" height="970" fill="#f3eee5"/>
<g font-family="Lato, Noto Sans CJK SC, sans-serif" fill="#252520">
<text x="72" y="67" font-size="16" letter-spacing="3" fill="#cc452e">02 / THE RESEARCH JOURNAL</text><text x="72" y="139" font-size="48" font-weight="700">RUN.md<tspan font-weight="400" fill="#a69e90"> / </tspan>每一步，都留下依据。</text><text x="72" y="185" font-size="20" fill="#68675f">可读的进展说明，可信的实验对比，以及可以追溯的原生产物。</text><path d="M72 228h1456M934 269v566" stroke="#b8b0a2"/>
<text x="72" y="289" font-size="15" letter-spacing="2" fill="#cc452e">LIVE NOTES</text><text x="72" y="347" font-size="29" font-weight="700">现在在做什么？</text><text x="72" y="395" font-size="21">先验证数据与策略入口，再运行同协议基线。</text><text x="72" y="433" font-size="19" fill="#68675f">安装完成不是验收通过；原生执行回执才是依据。</text><path d="M72 474h802" stroke="#d7cfc1"/>
<text x="72" y="526" font-size="29" font-weight="700">这次实验改变了什么？</text><text x="72" y="573" font-size="21">候选、数据版本、训练产物和加载身份一起记录。</text><text x="72" y="611" font-size="19" fill="#68675f">指标缺失就说明缺口，不把占位内容写成研究成果。</text><path d="M72 652h802" stroke="#d7cfc1"/>
<text x="72" y="704" font-size="29" font-weight="700">下一步，为什么？</text><text x="72" y="751" font-size="21">修复有证据的问题，或继续评测已完成的候选。</text><text x="72" y="789" font-size="19" fill="#68675f">失败保留原始原因，恢复后复验，不用重跑掩盖问题。</text>
<text x="987" y="289" font-size="15" letter-spacing="2" fill="#cc452e">COMPARISON / SAME PROTOCOL</text><text x="987" y="345" font-size="19" fill="#68675f">实验</text><text x="1236" y="345" font-size="19" fill="#68675f">指标</text><text x="1390" y="345" font-size="19" fill="#68675f">身份</text><path d="M987 366h541" stroke="#b8b0a2"/>
<text x="987" y="413" font-size="23" font-weight="700">Baseline</text><text x="1236" y="413" font-size="20">待评测</text><text x="1390" y="413" font-size="20">待核验</text><text x="987" y="468" font-size="23" font-weight="700">Candidate</text><text x="1236" y="468" font-size="20">待评测</text><text x="1390" y="468" font-size="20">待核验</text><path d="M987 501h541" stroke="#b8b0a2"/>
<text x="987" y="556" font-size="25" font-weight="700">Show the work.</text><circle cx="1001" cy="612" r="10" fill="#cc452e"/><path d="M1029 612h454" stroke="#cc452e" stroke-width="2"/><text x="987" y="658" font-size="20">原生视频 / 训练曲线 / 数据摘要</text><text x="987" y="696" font-size="18" fill="#68675f">真实产物可用时展示；没有就说明原因。</text><text x="987" y="769" font-size="16" letter-spacing="1" fill="#68675f">FACTS → INTERPRETATION → NEXT ACTION</text>
<rect x="0" y="855" width="1600" height="115" fill="#252520"/><text x="72" y="920" font-size="21" fill="#f3eee5">阅读体验示意 · 非真实运行截图 · 不含实测分数</text><text x="1528" y="920" text-anchor="end" font-size="16" letter-spacing="2" fill="#f3eee5">EVIDENCE FIRST. ALWAYS.</text>
</g></svg>
