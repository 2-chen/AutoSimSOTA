<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">AutoSimSOTA — 从仓库出发，让研究形成闭环</title>
  <desc id="desc">深色项目横幅：Agent、Skills、Evidence 连接形成研究循环。此为概念图，不是实验截图。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1628"/><stop offset="1" stop-color="#151d38"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#73e2c6"/><stop offset="1" stop-color="#79c9ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <g font-family="'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <rect x="58" y="48" width="322" height="32" rx="16" fill="#73e2c6" fill-opacity=".1"/>
    <circle cx="78" cy="64" r="4" fill="#73e2c6"/>
    <text x="93" y="70" font-size="12" letter-spacing="1.8" fill="#73e2c6">AUTONOMOUS SIMULATION RESEARCH</text>
    <text x="56" y="166" font-size="64" font-weight="700" fill="#f1f5ff">AutoSimSOTA<tspan fill="#73e2c6">.</tspan></text>
    <text x="60" y="222" font-size="28" fill="#e1e9f6">从仓库出发，让研究形成闭环。</text>
    <text x="60" y="271" font-size="17" fill="#9baac4">理解代码 · 原生实验 · 自主修复 · 可信评测</text>
    <rect x="60" y="331" width="146" height="38" rx="9" fill="#73e2c6" fill-opacity=".1" stroke="#73e2c6" stroke-opacity=".35"/>
    <text x="133" y="356" text-anchor="middle" font-size="14" fill="#73e2c6">AGENT-LED</text>
    <rect x="218" y="331" width="172" height="38" rx="9" fill="#79c9ff" fill-opacity=".08" stroke="#79c9ff" stroke-opacity=".35"/>
    <text x="304" y="356" text-anchor="middle" font-size="14" fill="#79c9ff">EVIDENCE-FIRST</text>
    <text x="60" y="410" font-size="12" fill="#7f90ae">Experimental framework · No universal SOTA guarantee</text>
    <circle cx="986" cy="217" r="133" fill="none" stroke="#475373" stroke-width="1" stroke-dasharray="5 9"/>
    <path d="M915 109L1082 169L985 327Z" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".55"/>
    <rect x="846" y="74" width="137" height="66" rx="13" fill="#192943" stroke="#73e2c6" stroke-opacity=".6"/>
    <text x="914" y="114" text-anchor="middle" font-size="20" fill="#73e2c6">Skills</text>
    <rect x="1001" y="149" width="165" height="74" rx="13" fill="#192943" stroke="#79c9ff" stroke-opacity=".6"/>
    <text x="1083" y="195" text-anchor="middle" font-size="22" fill="#79c9ff">Main Agent</text>
    <rect x="903" y="296" width="165" height="66" rx="13" fill="#192943" stroke="#b5a4ff" stroke-opacity=".6"/>
    <text x="985" y="336" text-anchor="middle" font-size="20" fill="#b5a4ff">Evidence</text>
    <text x="986" y="256" text-anchor="middle" font-size="13" fill="#9baac4">reason → act → verify</text>
  </g>
</svg>
