<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">一个决策者，一条可核验的实验链</title><desc id="desc">主 Agent 按需读技能，安排原生实验，证据回流；执行器保护协议与资源，Recorder 只读记录。</desc><rect width="1600" height="820" fill="#f3eee5"/>
<g font-family="Lato, Noto Sans CJK SC, sans-serif" fill="#252520">
<text x="72" y="69" font-size="16" letter-spacing="3" fill="#cc452e">01 / THE RESEARCH ENGINE</text><text x="72" y="139" font-size="45" font-weight="700">一个决策者，一条可核验的实验链。</text><text x="72" y="181" font-size="20" fill="#68675f">不是预设 benchmark 答案，而是读真实代码、采取行动、根据证据继续。</text><path d="M72 210h1456" stroke="#b8b0a2"/>
<g fill="none" stroke="#a69e90" stroke-width="2"><path d="M383 357H611M989 357h215"/><path d="M800 518v102H450v-130"/><path d="M1357 480v140H803"/></g><g fill="#cc452e"><path d="m601 350 12 7-12 7z"/><path d="m1194 350 12 7-12 7z"/><path d="m807 610-8 10 8 10z"/></g>
<text x="72" y="300" font-size="15" letter-spacing="2" fill="#68675f">INPUT / EXISTING REPOSITORY</text><text x="72" y="367" font-size="32" font-weight="700">仓库与资源</text><text x="72" y="405" font-size="19" fill="#68675f">源码隔离 · 显式资源连接</text><text x="72" y="441" font-size="19" fill="#68675f">数据 / 仿真资产 / 已有权重</text>
<circle cx="800" cy="367" r="151" fill="#cc452e"/><text x="800" y="345" text-anchor="middle" font-size="36" font-weight="700" fill="#fffaf1">Main Agent</text><text x="800" y="388" text-anchor="middle" font-size="22" fill="#fffaf1">判断 · 调度 · 修复 · 继续</text><text x="800" y="430" text-anchor="middle" font-size="15" letter-spacing="2" fill="#fffaf1">REASON → ACT → VERIFY</text>
<text x="1204" y="300" font-size="15" letter-spacing="2" fill="#68675f">EXECUTION / NATIVE PIPELINE</text><text x="1204" y="367" font-size="32" font-weight="700">原生实验</text><text x="1204" y="405" font-size="19" fill="#68675f">采集 → 训练 → Rollout</text><text x="1204" y="441" font-size="19" fill="#68675f">加载身份核验 · 冻结评测</text>
<text x="238" y="559" font-size="24" font-weight="700">Skills</text><text x="238" y="590" font-size="17" fill="#68675f">短目录，主动阅读</text><text x="1026" y="559" font-size="24" font-weight="700">Evidence</text><text x="1026" y="590" font-size="17" fill="#68675f">指标、产物与失败回执</text>
<path d="M72 650h1456" stroke="#b8b0a2"/><text x="72" y="698" font-size="19" font-weight="700">受控执行器</text><text x="271" y="698" font-size="18" fill="#68675f">保护源仓库 / 实验协议 / 总预算</text><text x="927" y="698" font-size="19" font-weight="700">只读 Recorder</text><text x="1150" y="698" font-size="18" fill="#68675f">中文记录 / 图表 / Demo</text>
<text x="72" y="768" font-size="15" fill="#68675f">Resource · Objective · Init · Monitor · Fix · Ideator · Scheduler · Supervisor</text><text x="1528" y="768" text-anchor="end" font-size="15" fill="#68675f">RESPONSIBILITIES, NOT EIGHT FIXED PROCESSES</text>
</g></svg>
